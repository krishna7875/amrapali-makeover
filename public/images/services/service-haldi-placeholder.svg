<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="haldiBg" x1="0" y1="0" x2="600" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D151F"/>
      <stop offset="60%" stop-color="#3A1C20"/>
      <stop offset="100%" stop-color="#1E0D16"/>
    </linearGradient>
    <linearGradient id="haldiGold" x1="150" y1="80" x2="450" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2D283"/>
      <stop offset="50%" stop-color="#CFA44A"/>
      <stop offset="100%" stop-color="#8F6B38"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#haldiBg)"/>

  <!-- Luxury Filigree Borders -->
  <rect x="20" y="20" width="560" height="410" rx="4" stroke="#CFA44A" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="544" height="394" rx="2" stroke="#CFA44A" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Corner Filigree -->
  <path d="M35 55 V 35 H 55" stroke="#CFA44A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M565 55 V 35 H 545" stroke="#CFA44A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M35 395 V 415 H 55" stroke="#CFA44A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M565 395 V 415 H 545" stroke="#CFA44A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Haldi Sunburst / Marigold Blossom Motif -->
  <g transform="translate(300, 175)">
    <!-- Radiance Circle -->
    <circle cx="0" cy="0" r="85" stroke="#CFA44A" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="70" stroke="#CFA44A" stroke-width="0.75" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="55" fill="#3A1C20" fill-opacity="0.6" stroke="url(#haldiGold)" stroke-width="1.5"/>

    <!-- Marigold Petal Symmetry Motif -->
    <path d="M0 -36 C10 -20 10 -10 0 0 C-10 -10 -10 -20 0 -36 Z" fill="#F2D283" fill-opacity="0.7" stroke="url(#haldiGold)" stroke-width="1"/>
    <path d="M0 36 C10 20 10 10 0 0 C-10 10 -10 20 0 36 Z" fill="#F2D283" fill-opacity="0.7" stroke="url(#haldiGold)" stroke-width="1"/>
    <path d="M-36 0 C-20 10 -10 10 0 0 C-10 -10 -20 -10 -36 0 Z" fill="#F2D283" fill-opacity="0.7" stroke="url(#haldiGold)" stroke-width="1"/>
    <path d="M36 0 C20 10 10 10 0 0 C10 -10 20 -10 36 0 Z" fill="#F2D283" fill-opacity="0.7" stroke="url(#haldiGold)" stroke-width="1"/>

    <!-- Diagonal Petals -->
    <circle cx="0" cy="0" r="10" fill="#F2D283" stroke="#8F6B38" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#3A1C20"/>
  </g>

  <!-- Title & Category -->
  <text x="300" y="295" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#FBF8F4" letter-spacing="1">
    HALDI MAKEUP
  </text>
  <text x="300" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#CFA44A" letter-spacing="2.5">
    HALDI CELEBRATIONS &#8226; AMRAPALI MAKEOVER
  </text>

  <!-- Reservation Disclaimer Box -->
  <rect x="150" y="352" width="300" height="42" rx="3" fill="#1E0D16" fill-opacity="0.85" stroke="#CFA44A" stroke-width="0.75" stroke-opacity="0.45"/>
  <text x="300" y="377" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#DFC8C2" letter-spacing="1">
    Illustrative Service Artwork
  </text>
</svg>
