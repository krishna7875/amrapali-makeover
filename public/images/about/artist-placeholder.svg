<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <!-- Background with deep plum gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A1420"/>
      <stop offset="50%" stop-color="#3D1A2C"/>
      <stop offset="100%" stop-color="#1E0D16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="100" y1="100" x2="700" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4B98E"/>
      <stop offset="50%" stop-color="#B99561"/>
      <stop offset="100%" stop-color="#8F6B38"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Luxury Filigree Borders -->
  <rect x="30" y="30" width="740" height="940" rx="4" stroke="#B99561" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <rect x="42" y="42" width="716" height="916" rx="2" stroke="#B99561" stroke-width="0.75" stroke-opacity="0.25" fill="none"/>

  <!-- Decorative Corner Accents -->
  <path d="M50 80 V 50 H 80" stroke="#B99561" stroke-width="2" stroke-linecap="round"/>
  <path d="M750 80 V 50 H 720" stroke="#B99561" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 920 V 950 H 80" stroke="#B99561" stroke-width="2" stroke-linecap="round"/>
  <path d="M750 920 V 950 H 720" stroke="#B99561" stroke-width="2" stroke-linecap="round"/>

  <!-- Editorial Geometric Halo -->
  <circle cx="400" cy="420" r="190" stroke="#B99561" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3"/>
  <circle cx="400" cy="420" r="160" stroke="#B99561" stroke-width="0.75" stroke-opacity="0.4"/>
  <circle cx="400" cy="420" r="130" stroke="#B99561" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Elegant Stylized Artist Silhouette Motif -->
  <g transform="translate(400, 420)">
    <!-- Stylized Head & Hair Contour -->
    <path d="M 0 -85 C 45 -85 75 -40 75 25 C 75 75 40 115 0 115 C -40 115 -75 75 -75 25 C -75 -40 -45 -85 0 -85 Z" fill="#4B1728" fill-opacity="0.5" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Soft Face Oval -->
    <ellipse cx="0" cy="15" rx="45" ry="58" fill="#FBF8F4" fill-opacity="0.08" stroke="#B99561" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Classical Bindi / Accent Mark -->
    <circle cx="0" cy="-10" r="4" fill="#B99561"/>
    <!-- Shoulders Contour -->
    <path d="M -110 140 C -85 100 -50 85 0 85 C 50 85 85 100 110 140" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography & Transparency Notice -->
  <text x="400" y="660" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#FBF8F4" letter-spacing="1.5">
    AMRAPALI
  </text>
  <text x="400" y="695" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#B99561" letter-spacing="3">
    PROFESSIONAL MAKEUP ARTIST
  </text>

  <!-- Divider Line -->
  <line x1="320" y1="725" x2="480" y2="725" stroke="#B99561" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="400" cy="725" r="3" fill="#B99561"/>

  <!-- Status Box -->
  <rect x="180" y="760" width="440" height="70" rx="4" fill="#1E0D16" fill-opacity="0.9" stroke="#B99561" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="790" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#F2E5E2" letter-spacing="1">
    ARTIST PORTRAIT RESERVED
  </text>
  <text x="400" y="812" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#C58F91">
    Approved Studio Photography Coming Soon
  </text>

  <!-- Base Location & Verification Badge -->
  <rect x="140" y="865" width="520" height="50" rx="3" fill="#3D1A2C" fill-opacity="0.8" stroke="#B99561" stroke-width="0.75" stroke-opacity="0.3"/>
  <text x="400" y="895" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#DFC8C2">
    Bhiwandi, Thane, Maharashtra • 1–3 Years Experience
  </text>
</svg>
